spring:
  application:
    name: be-interview-prep
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/be_interview_prep}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    locations: classpath:db/migration

app:
  short-url:
    base-url: ${SHORT_URL_BASE_URL:http://localhost:8080}
    code-length: 7
  security:
    jwt:
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:PT15M}
      issuer: be-interview-prep
