spring:
  application:
    name: be-interview-prep
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: test-only-jwt-signing-key-not-for-production-use
      ttl: PT15M
      issuer: be-interview-prep
